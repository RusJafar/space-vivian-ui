name: Deploy to VPS via SSH/1

on:
  push:
    branches:
      - test-branch # Trigger build on push to the test-branch //
      - main
  pull_request:
    branches:
      - main # Trigger build when creating a PR to the main branch
  
jobs:
  build:
    runs-on: ubuntu-latest
  
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          docker-compose down
          docker-compose up -d --build